# Publish @r4mai/sdk on npm via trusted publishing (OIDC, no tokens).
#
# Fires when a v* tag is pushed (publish-sdks.sh creates and pushes the tag)
# and publishes the version outright, with provenance. No human step: the
# tag is the release. (Staging with 2FA approval was tried first and dropped
# on 2026-10-29 — one more thing to forget, for a package generated from a
# reviewed spec.)
#
# One-time setup before this works:
#   1. The package must exist on npm (the first version was published by
#      hand; trusted publishers cannot be registered for a name that has no
#      package yet).
#   2. On npmjs.com → the package → Settings → Trusted Publisher → GitHub
#      Actions, set: org/user = r4m-ai, repo = sdk-typescript,
#      workflow = publish.yml, environment = (leave blank). Under "Allowed
#      actions" enable publishing and dist-tags for the workflow.
#   3. After that, every pushed v* tag publishes via OIDC — no NPM_TOKEN.
#
# This file is generated from the monorepo (scripts/sdk-templates/) — edit it
# there, not in the published repo, or it will be overwritten on next publish.
name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # npm >= 11.5.1 is required for trusted publishing.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # No NODE_AUTH_TOKEN: with a trusted publisher configured, npm mints a
      # short-lived OIDC credential and attaches provenance automatically.
      - name: Publish
        run: npm publish --provenance --access public
